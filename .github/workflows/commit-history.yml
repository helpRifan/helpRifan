name: Update commit history chart

on:
  schedule:
    - cron: "0 3 * * *"  # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/commit_history.py ${{ github.repository_owner }} assets/commit-history.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-history.svg
          git diff --cached --quiet || git commit -m "Update commit history chart"
          git push
